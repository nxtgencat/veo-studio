# Single container: web :3000 + backend on loopback :8787 (via /api proxy).
# Usage: docker login ghcr.io && docker compose pull && docker compose up -d
# Optional .env next to this file for backend secrets (VERTEX_ACCESS_TOKEN,
# GOOGLE_CLOUD_PROJECT, VERTEXAI_LOCATION, LOG_LEVEL, VEO_PASSWORD).

name: veo

services:
  web:
    image: ghcr.io/nxtgencat/veo-studio:${TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - veo-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  veo-data:
